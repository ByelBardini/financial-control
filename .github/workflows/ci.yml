name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela runs antigos do mesmo branch/PR quando chega um push novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: server (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          check-latest: true

      # golangci-lint v2 cobre lint + format (gofmt/goimports) + go vet num passo só.
      - name: Lint + format (golangci-lint)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: server

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

      - name: Vulnerability scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  client:
    name: client (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Test
        run: npm test -- --ci

      - name: Build (expo export web)
        run: npx expo export --platform web

      # Falha só em vulnerabilidades high/critical. As moderate atuais são deps
      # transitivas de dev do toolchain Expo/Jest (triagem à parte).
      - name: Vulnerability audit (npm)
        run: npm audit --audit-level=high

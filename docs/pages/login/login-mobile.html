<!doctype html>

<html class="dark" lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Pobrify | Login</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link

    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-secondary": "#213600",
              surface: "#111317",
              "on-primary": "#3c0091",
              primary: "#d0bcff",
              "on-tertiary-container": "#252937",
              "on-tertiary": "#2c303d",
              "tertiary-fixed": "#dfe2f4",
              "on-tertiary-fixed": "#171b28",
              "surface-container-high": "#282a2e",
              "surface-tint": "#d0bcff",
              "on-secondary-fixed-variant": "#334f00",
              "on-primary-fixed-variant": "#5516be",
              "surface-container-low": "#1a1c20",
              "on-surface-variant": "#cbc3d7",
              "outline-variant": "#494454",
              "on-primary-fixed": "#23005c",
              "on-surface": "#e2e2e8",
              "on-secondary-container": "#304b00",
              "surface-bright": "#37393e",
              "surface-container": "#1e2024",
              "on-secondary-fixed": "#121f00",
              "inverse-surface": "#e2e2e8",
              "secondary-container": "#83c300",
              background: "#111317",
              "tertiary-fixed-dim": "#c3c6d7",
              "inverse-on-surface": "#2f3035",
              error: "#ffb4ab",
              "on-error": "#690005",
              "tertiary-container": "#8d90a0",
              "secondary-fixed-dim": "#98da27",
              "on-background": "#e2e2e8",
              "primary-fixed": "#e9ddff",
              "surface-dim": "#111317",
              outline: "#958ea0",
              "surface-container-lowest": "#0c0e12",
              tertiary: "#c3c6d7",
              "on-tertiary-fixed-variant": "#424655",
              "primary-fixed-dim": "#d0bcff",
              "surface-container-highest": "#333539",
              secondary: "#9ddf2e",
              "error-container": "#93000a",
              "on-error-container": "#ffdad6",
              "secondary-fixed": "#b2f746",
              "surface-variant": "#333539",
              "primary-container": "#a078ff",
              "on-primary-container": "#340080",
              "inverse-primary": "#6d3bd7",
            },
            borderRadius: {
              DEFAULT: "0.125rem",
              lg: "0.25rem",
              xl: "0.5rem",
              full: "0.75rem",
            },
            spacing: {
              gutter: "16px",
              "container-margin": "24px",
              "stack-sm": "4px",
              "stack-lg": "24px",
              base: "8px",
              "stack-md": "12px",
            },
            fontFamily: {
              "label-sm": ["Geist"],
              "label-md": ["Geist"],
              "headline-md": ["Hanken Grotesk"],
              "display-lg-mobile": ["Hanken Grotesk"],
              "body-lg": ["Hanken Grotesk"],
              "headline-sm": ["Hanken Grotesk"],
              "body-md": ["Hanken Grotesk"],
              "display-lg": ["Hanken Grotesk"],
            },
            fontSize: {
              "label-sm": ["12px", { lineHeight: "16px", fontWeight: "600" }],
              "label-md": [
                "14px",
                {
                  lineHeight: "20px",
                  letterSpacing: "0.05em",
                  fontWeight: "500",
                },
              ],
              "headline-md": [
                "24px",
                { lineHeight: "32px", fontWeight: "600" },
              ],
              "display-lg-mobile": [
                "36px",
                {
                  lineHeight: "42px",
                  letterSpacing: "-0.02em",
                  fontWeight: "700",
                },
              ],
              "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
              "headline-sm": [
                "20px",
                { lineHeight: "28px", fontWeight: "600" },
              ],
              "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
              "display-lg": [
                "48px",
                {
                  lineHeight: "56px",
                  letterSpacing: "-0.02em",
                  fontWeight: "700",
                },
              ],
            },
          },
        },
      };
    </script>
    <style>
      body {
        background-color: #111317;
        background-image:
          radial-gradient(
            circle at 10% 20%,
            rgba(157, 223, 46, 0.03) 0%,
            transparent 40%
          ),
          radial-gradient(
            circle at 90% 80%,
            rgba(141, 144, 160, 0.05) 0%,
            transparent 40%
          );
      }
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body
    class="flex flex-col min-h-screen text-on-surface selection:bg-secondary selection:text-on-secondary"
  >
    <!-- Hero Background Image (Atmospheric) -->
    <div class="fixed inset-0 z-[-1] opacity-20 overflow-hidden">
      <img
        class="w-full h-full object-cover grayscale brightness-50 contrast-125"
        data-alt="A cinematic, high-contrast photograph of a sleek, dark modern financial terminal displaying complex but chaotic data visualizations in vibrant acid green and soft purple. The lighting is moody and institutional, with sharp highlights reflecting off dark glass surfaces, creating a premium yet cynical atmosphere. The perspective is an extreme close-up on digital textures, suggesting a high-stakes corporate environment where everything is sophisticated but slightly on the edge of collapse."
        src="https://lh3.googleusercontent.com/aida-public/AB6AXuDXNkA7igOzXMhR7-40XHBbzw8AF1smw7FNmsTg70uanwlbmG9li0yq2YbHplI8dTUF3uDyCVQY6GxipOFskho2YGEJKlDSfCxB1L2eHJVjGU6KoMrVHm56FIoP28O1YS8Tec8kEeM-3ZjtwnUicjjwIqSjK-ubna0UABzV_sk17LOsvuvojyPTYAUOQfYvCln5dz_PKljRgH6orVLAiOj1fqbu_AsqKm6IGQUPF3oJgRvBCX4YesA6782NyBOZn7qQzM2T_4GnacCl"
      />
    </div>
    <!-- Main Content Canvas -->
    <main
      class="flex-grow flex flex-col justify-center px-container-margin py-12 max-w-md mx-auto w-full"
    >
      <!-- Header Section -->
      <header class="mb-stack-lg text-center">
        <h1
          class="font-headline-md text-headline-md text-secondary font-bold mb-stack-sm tracking-tight"
        >
          Pobrify
        </h1>
        <p class="font-body-md text-body-md text-on-surface-variant italic">
          Acesse sua gestão de crise.
        </p>
      </header>
      <!-- Login Form -->
      <div class="space-y-stack-lg">
        <form class="space-y-stack-md" onsubmit="event.preventDefault()">
          <!-- Input Group: Email -->
          <div class="flex flex-col gap-1.5">
            <label
              class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest px-1"
              for="username"
            >
              Email ou Username
            </label>
            <div class="relative group">
              <input
                class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded-lg px-4 py-3 text-body-md focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-on-tertiary-fixed-variant"
                id="username"
                placeholder="seu_nome@falencia.com"
                type="text"
              />
            </div>
          </div>
          <!-- Input Group: Password -->
          <div class="flex flex-col gap-1.5">
            <div class="flex justify-between items-end px-1">
              <label
                class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest"
                for="password"
              >
                Password
              </label>
              <a
                class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors"
                href="#"
              >
                Esqueci minha senha
              </a>
            </div>
            <div class="relative group">
              <input
                class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded-lg px-4 py-3 text-body-md focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-on-tertiary-fixed-variant"
                id="password"
                placeholder="••••••••"
                type="password"
              />
              <button
                class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors"
                type="button"
              >
                <span class="material-symbols-outlined text-base"
                  >visibility</span
                >
              </button>
            </div>
          </div>
          <!-- Primary Action -->
          <button
            class="w-full bg-primary text-on-primary font-headline-sm text-headline-sm py-4 rounded-full flex justify-center items-center gap-2 mt-stack-lg active:scale-[0.98] transition-all hover:bg-primary-container shadow-lg shadow-primary/10"
            type="submit"
          >
            <span
              class="material-symbols-outlined"
              style="font-variation-settings: &quot;FILL&quot; 1"
              >login</span
            >
            Entrar
          </button>
        </form>
        <!-- Divider -->
        <div class="relative flex items-center py-4">
          <div class="flex-grow border-t border-outline-variant/20"></div>
          <span
            class="flex-shrink mx-4 font-label-sm text-label-sm text-on-tertiary-fixed-variant uppercase"
            >Ou perca tempo com</span
          >
          <div class="flex-grow border-t border-outline-variant/20"></div>
        </div>
        <!-- Social Logins -->
        <div class="grid grid-cols-2 gap-stack-md">
          <button
            class="flex items-center justify-center gap-2 border border-outline-variant/30 py-3 rounded-lg hover:bg-surface-container transition-colors"
          >
            <img
              alt="Google"
              class="w-4 h-4 grayscale opacity-70 group-hover:grayscale-0"
              src="https://lh3.googleusercontent.com/aida-public/AB6AXuBFWaC9s6r0Z_HYNmUeLp_4CVIaf9iXgBIabFu2s3yNbdU7es__Y2ujj3kCvzmnW_zOtidamV7-tKrtMaLWPf7zGoUNS3RAhWZpCv6PYFxwd9l1445iK1HTqLJlV-GtY0Dfm8rfjmotV7yjIxKdEyAeaR-996d8JXg0-1xWmy2F2uHbWHXUhs6Km1DnrVz9lLrVyUb6Xu3kAseywvthDJBzcjYAxS_WnCTeDeUhSWh0ccAyf7aev_aPb7dgrbTGOq2SNui4bAzcjvRx"
            />
            <span class="font-label-md text-label-md">Google</span>
          </button>
          <button
            class="flex items-center justify-center gap-2 border border-outline-variant/30 py-3 rounded-lg hover:bg-surface-container transition-colors"
          >
            <span
              class="material-symbols-outlined text-base"
              style="font-variation-settings: &quot;FILL&quot; 1"
              >apps</span
            >
            <span class="font-label-md text-label-md">Apple</span>
          </button>
        </div>
        <!-- Signup Link -->
        <div class="text-center pt-stack-md">
          <a
            class="font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors"
            href="#"
          >
            Não tem uma conta?
            <span class="text-secondary font-bold"
              >Crie sua falência premium</span
            >
          </a>
        </div>
      </div>
    </main>
    <!-- Footer Identity (Institutional Shell) -->
    <footer
      class="w-full max-w-md mx-auto px-container-margin py-stack-lg border-t border-outline-variant/10"
    >
      <div class="flex flex-col items-center gap-stack-sm opacity-60">
        <p
          class="font-label-sm text-label-sm text-on-tertiary-fixed-variant text-center"
        >
          © 2024 Pobrify Institutional. All assets liquidated.
        </p>
        <div class="flex gap-stack-md">
          <a
            class="font-label-sm text-label-sm text-on-tertiary-fixed-variant hover:text-on-surface"
            href="#"
            >Terms</a
          >
          <a
            class="font-label-sm text-label-sm text-on-tertiary-fixed-variant hover:text-on-surface"
            href="#"
            >Privacy</a
          >
          <a
            class="font-label-sm text-label-sm text-on-tertiary-fixed-variant hover:text-on-surface"
            href="#"
            >Help Center</a
          >
        </div>
      </div>
    </footer>
    <!-- Panic Meter Ambient Detail (Corner) -->
    <div
      class="fixed bottom-4 right-4 h-1 w-24 bg-surface-container rounded-full overflow-hidden opacity-40"
    >
      <div
        class="h-full bg-gradient-to-r from-secondary via-secondary to-error w-[85%]"
      ></div>
      <div
        class="absolute -top-4 right-0 font-label-sm text-label-sm text-error/60"
      >
        Risk High
      </div>
    </div>
    <script>
      // Micro-interactions for input focus effects
      document.querySelectorAll("input").forEach((input) => {
        input.addEventListener("focus", () => {
          input.parentElement.parentElement.classList.add("opacity-100");
        });
        input.addEventListener("blur", () => {
          input.parentElement.parentElement.classList.remove("opacity-100");
        });
      });

      // Simple button active state visual feedback
      const btn = document.querySelector('button[type="submit"]');
      btn.addEventListener("click", () => {
        btn.innerHTML =
          '<span class="material-symbols-outlined animate-spin">progress_activity</span> Carregando perdas...';
        setTimeout(() => {
          btn.innerHTML =
            '<span class="material-symbols-outlined" style="font-variation-settings: \'FILL\' 1;">login</span> Entrar';
        }, 2000);
      });
    </script>
  </body>
</html>

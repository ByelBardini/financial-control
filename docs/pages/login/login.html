<!doctype html>

<html class="dark" lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Pobrify - Acesso Institucional</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=Geist:wght@400;500;600&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-secondary": "#213600",
              "secondary-container": "#83c300",
              "primary-fixed": "#e9ddff",
              "on-tertiary-container": "#252937",
              "primary-fixed-dim": "#d0bcff",
              tertiary: "#c3c6d7",
              "inverse-on-surface": "#2f3035",
              background: "#111317",
              "surface-container": "#1e2024",
              primary: "#d0bcff",
              "tertiary-container": "#8d90a0",
              "on-primary-container": "#340080",
              "surface-container-high": "#282a2e",
              "surface-tint": "#d0bcff",
              "error-container": "#93000a",
              "on-error": "#690005",
              "inverse-surface": "#e2e2e8",
              "tertiary-fixed": "#dfe2f4",
              "surface-container-lowest": "#0c0e12",
              surface: "#111317",
              "secondary-fixed-dim": "#98da27",
              "surface-container-low": "#1a1c20",
              "on-tertiary-fixed-variant": "#424655",
              "inverse-primary": "#6d3bd7",
              "on-surface": "#e2e2e8",
              outline: "#958ea0",
              "primary-container": "#a078ff",
              "on-error-container": "#ffdad6",
              error: "#ffb4ab",
              "surface-bright": "#37393e",
              "on-primary-fixed-variant": "#5516be",
              "on-background": "#e2e2e8",
              "outline-variant": "#494454",
              "on-tertiary": "#2c303d",
              "on-secondary-fixed": "#121f00",
              "on-primary-fixed": "#23005c",
              "surface-variant": "#333539",
              "secondary-fixed": "#b2f746",
              "on-primary": "#3c0091",
              secondary: "#9ddf2e",
              "on-secondary-container": "#304b00",
              "surface-dim": "#111317",
              "on-tertiary-fixed": "#171b28",
              "on-secondary-fixed-variant": "#334f00",
              "surface-container-highest": "#333539",
              "on-surface-variant": "#cbc3d7",
              "tertiary-fixed-dim": "#c3c6d7",
            },
            borderRadius: {
              DEFAULT: "0.125rem",
              lg: "0.25rem",
              xl: "0.5rem",
              full: "0.75rem",
            },
            spacing: {
              gutter: "16px",

            },
            fontFamily: {

              "display-lg": ["Hanken Grotesk"],
              "display-lg-mobile": ["Hanken Grotesk"],
              "label-md": ["Geist"],
              "body-md": ["Hanken Grotesk"],
              "label-sm": ["Geist"],
              "headline-sm": ["Hanken Grotesk"],
              "body-lg": ["Hanken Grotesk"],
            },
            fontSize: {

                "24px",
                { lineHeight: "32px", fontWeight: "600" },
              ],

              "label-sm": ["12px", { lineHeight: "16px", fontWeight: "600" }],

                "20px",

    <style>
      body {
        background-color: #111317;
        background-image:
          radial-gradient(at 0% 0%, rgba(48, 75, 0, 0.15) 0px, transparent 50%),
          radial-gradient(
            at 100% 100%,
            rgba(109, 59, 215, 0.1) 0px,
            transparent 50%
          );
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .login-card {
        background: rgba(23, 26, 33, 0.8);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(245, 247, 250, 0.08);
      }
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
    </style>
  </head>
  <body class="text-on-surface antialiased">
    <!-- Main Content Canvas -->
    <main
      class="flex-grow flex flex-col items-center justify-center px-container-margin py-stack-lg"
    >
      <!-- Branding Section -->
      <div class="mb-stack-lg text-center">
        <h1
          class="text-headline-md font-headline-md font-bold text-secondary tracking-tight"
        >
          Pobrify
        </h1>
        <p class="text-label-md font-label-md text-on-surface-variant mt-2">
          Acesse sua gestão de crise.
        </p>
      </div>
      <!-- Login Form Container -->
      <div class="login-card w-full max-w-md p-8 rounded-xl shadow-2xl">
        <form class="space-y-6" onsubmit="return false;">
          <!-- Input Group: User -->
          <div class="space-y-2">
            <label
              class="text-label-sm font-label-sm text-on-surface-variant block"
              for="username"
              >E-mail ou Usuário</label
            >
            <div class="relative">
              <input
                class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface text-body-md font-body-md px-4 py-3 rounded-lg focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-outline-variant"
                id="username"
                placeholder="seu@email.com"
                type="text"
              />
            </div>
          </div>
          <!-- Input Group: Password -->
          <div class="space-y-2">
            <div class="flex justify-between items-center">
              <label
                class="text-label-sm font-label-sm text-on-surface-variant block"
                for="password"
                >Senha</label
              >
              <a
                class="text-label-sm font-label-sm text-primary hover:text-primary-fixed-dim transition-colors"
                href="#"
                >Esqueci minha senha</a
              >
            </div>
            <div class="relative">
              <input
                class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface text-body-md font-body-md px-4 py-3 rounded-lg focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-outline-variant"
                id="password"
                placeholder="••••••••"
                type="password"
              />
            </div>
          </div>
          <!-- Primary Action -->
          <button
            class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-lg hover:opacity-90 active:scale-[0.98] transition-all flex justify-center items-center gap-2"
            type="submit"
          >
            Entrar
            <span class="material-symbols-outlined text-[20px]">login</span>
          </button>
          <!-- Divider -->
          <div class="relative flex items-center py-2">
            <div class="flex-grow border-t border-outline-variant/30"></div>
            <span
              class="flex-shrink mx-4 text-label-sm font-label-sm text-outline-variant"
              >ou continuar com</span
            >
            <div class="flex-grow border-t border-outline-variant/30"></div>
          </div>
          <!-- Social Logins -->
          <div class="grid grid-cols-2 gap-4">
            <button
              class="flex items-center justify-center gap-3 px-4 py-3 bg-surface-container border border-outline-variant rounded-lg hover:bg-surface-container-high transition-colors"
              type="button"
            >
              <svg class="w-5 h-5" viewbox="0 0 24 24">
                <path
                  d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                  fill="currentColor"
                ></path>
                <path
                  d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                  fill="currentColor"
                ></path>
                <path
                  d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                  fill="currentColor"
                ></path>
                <path
                  d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                  fill="currentColor"
                ></path>
              </svg>
              <span class="text-label-sm font-label-sm text-on-surface"
                >Google</span
              >
            </button>
            <button
              class="flex items-center justify-center gap-3 px-4 py-3 bg-surface-container border border-outline-variant rounded-lg hover:bg-surface-container-high transition-colors"
              type="button"
            >
              <svg class="w-5 h-5" viewbox="0 0 24 24">
                <path
                  d="M17.05 20.28c-.98.95-2.05 1.79-3.48 1.79-1.42 0-1.85-.86-3.53-.86-1.67 0-2.18.84-3.51.86-1.39.02-2.39-.81-3.41-1.81-2.05-2.01-3.64-5.69-3.64-9.17 0-3.45 1.77-5.27 3.45-5.27 1.68 0 2.59 1.02 3.59 1.02 1 0 2.07-1.02 3.59-1.02 1.51 0 2.83.84 3.59 2.13-3.08 1.54-2.58 5.92.51 7.21-.69 1.99-1.63 3.61-3.16 5.12zm-3.02-15.63c-.01 0-.01 0 0 0 .73-1.83-.43-3.65-1.15-4.65 1.83.08 3.56 1.41 4.3 3.1-.9.51-2.06.51-3.15 1.55z"
                  fill="currentColor"
                ></path>
              </svg>
              <span class="text-label-sm font-label-sm text-on-surface"
                >Apple</span
              >
            </button>
          </div>
        </form>
        <!-- Irony/Micro-copy Support -->
        <div class="mt-8 text-center">
          <p class="text-label-sm font-label-sm text-outline-variant">
            Não tem uma conta?
            <a class="text-secondary hover:underline ml-1" href="#"
              >Crie sua falência premium</a
            >
          </p>
        </div>
      </div>
      <!-- Atmospheric Panic Meter Concept (Micro-interaction) -->
      <div
        class="mt-stack-lg max-w-md w-full px-8 opacity-40 hover:opacity-100 transition-opacity duration-500"
      >
        <div class="flex justify-between items-end mb-2">
          <span
            class="text-label-sm font-label-sm text-outline-variant uppercase tracking-widest"
            >Panic Level</span
          >
          <span
            class="text-label-sm font-label-sm text-secondary"
            id="panic-value"
            >Institutional</span
          >
        </div>
        <div
          class="h-1 w-full bg-surface-container-highest rounded-full overflow-hidden"
        >
          <div
            class="h-full bg-gradient-to-r from-secondary to-error w-[15%] transition-all duration-1000 ease-in-out"
            id="panic-bar"
          ></div>
        </div>
      </div>
    </main>
    <!-- Footer: JSON Injected -->
    <footer
      class="w-full bg-background dark:bg-background border-t border-outline-variant/20"
    >
      <div
        class="flex flex-col md:flex-row justify-between items-center px-container-margin py-stack-lg w-full max-w-7xl mx-auto"
      >
        <div class="mb-4 md:mb-0">
          <span class="text-label-md font-label-md text-on-surface"
            >Pobrify</span
          >
          <p
            class="text-label-sm font-label-sm text-on-tertiary-fixed-variant mt-1"
          >
            © 2024 Pobrify Institutional. All assets liquidated.
          </p>
        </div>
        <div class="flex gap-gutter">
          <a
            class="text-label-sm font-label-sm text-on-tertiary-fixed-variant hover:text-primary transition-colors"
            href="#"
            >Termos de Uso</a
          >
          <a
            class="text-label-sm font-label-sm text-on-tertiary-fixed-variant hover:text-primary transition-colors"
            href="#"
            >Privacidade</a
          >
          <a
            class="text-label-sm font-label-sm text-on-tertiary-fixed-variant hover:text-primary transition-colors"
            href="#"
            >Help Center</a
          >
        </div>
      </div>
    </footer>
    <script>
      // Micro-interaction for the "Panic Meter"
      document.addEventListener("DOMContentLoaded", () => {
        const bar = document.getElementById("panic-bar");
        const value = document.getElementById("panic-value");
        const stages = [
          "Calm",
          "Institutional",
          "Concerned",
          "Liquidating",
          "Panic",
        ];

        setInterval(() => {
          const randomWidth = Math.floor(Math.random() * 40) + 10;
          bar.style.width = randomWidth + "%";

          let stageIndex = Math.floor((randomWidth / 100) * stages.length);
          value.textContent = stages[Math.min(stageIndex, stages.length - 1)];

          if (randomWidth > 40) {
            value.classList.replace("text-secondary", "text-error");
          } else {
            value.classList.replace("text-error", "text-secondary");
          }
        }, 3000);
      });

      // Subtle parallax or ambient movement could go here
    </script>
  </body>
</html>
